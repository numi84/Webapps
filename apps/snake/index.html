<!DOCTYPE html>
<html lang="de">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Snake</title>
    <link rel="stylesheet" href="snake.css">
</head>
<body>
    <div class="container">
        <header>
            <a href="../../index.html" class="back-button">← Zurück zum Hub</a>
            <h1>🐍 Snake</h1>
        </header>

        <div class="game-container">
            <div class="info-bar">
                <div class="info-item">
                    <span class="label">Punkte:</span>
                    <span id="score" class="value">0</span>
                </div>
                <div class="info-item">
                    <span class="label">Highscore:</span>
                    <span id="highscore" class="value">0</span>
                </div>
            </div>

            <canvas id="game-canvas"></canvas>

            <div class="controls">
                <div class="difficulty-selector">
                    <button class="diff-btn active" data-speed="150">Langsam</button>
                    <button class="diff-btn" data-speed="100">Mittel</button>
                    <button class="diff-btn" data-speed="70">Schnell</button>
                </div>

                <button id="start-btn" class="start-btn">Neues Spiel</button>

                <div class="mobile-controls">
                    <div class="arrow-row">
                        <button class="arrow-btn" data-direction="up">↑</button>
                    </div>
                    <div class="arrow-row">
                        <button class="arrow-btn" data-direction="left">←</button>
                        <button class="arrow-btn" data-direction="down">↓</button>
                        <button class="arrow-btn" data-direction="right">→</button>
                    </div>
                </div>
            </div>

            <div class="instructions">
                <p><strong>Steuerung:</strong> Pfeiltasten oder Buttons verwenden</p>
                <p>Sammle Äpfel 🍎 und werde länger!</p>
            </div>
        </div>
    </div>

    <script src="snake.js"></script>
</body>
</html>
