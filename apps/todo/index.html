<!DOCTYPE html>
<html lang="de">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Todo Liste</title>
    <link rel="stylesheet" href="todo.css">
</head>
<body>
    <div class="container">
        <header>
            <a href="../../index.html" class="back-button">← Zurück zum Hub</a>
            <h1>📝 Todo Liste</h1>
        </header>

        <div class="todo-container">
            <div class="stats">
                <div class="stat-item">
                    <span class="stat-label">Gesamt:</span>
                    <span id="total-count" class="stat-value">0</span>
                </div>
                <div class="stat-item">
                    <span class="stat-label">Offen:</span>
                    <span id="active-count" class="stat-value">0</span>
                </div>
                <div class="stat-item">
                    <span class="stat-label">Erledigt:</span>
                    <span id="completed-count" class="stat-value">0</span>
                </div>
            </div>

            <div class="input-section">
                <input type="text" id="todo-input" placeholder="Neue Aufgabe hinzufügen..." />
                <button id="add-btn" class="add-btn">Hinzufügen</button>
            </div>

            <div class="filter-section">
                <button class="filter-btn active" data-filter="all">Alle</button>
                <button class="filter-btn" data-filter="active">Offen</button>
                <button class="filter-btn" data-filter="completed">Erledigt</button>
            </div>

            <div id="todo-list" class="todo-list"></div>

            <div class="actions">
                <button id="export-btn" class="action-btn">📥 Exportieren</button>
                <button id="import-btn" class="action-btn">📤 Importieren</button>
                <button id="clear-completed-btn" class="action-btn">Erledigte löschen</button>
                <button id="clear-all-btn" class="action-btn danger">Alles löschen</button>
            </div>
            <input type="file" id="import-file-input" accept=".json" style="display: none;">
        </div>
    </div>

    <script src="todo.js"></script>
</body>
</html>
