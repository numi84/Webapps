<!DOCTYPE html>
<html lang="de">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Bildvergleich - A/B Vergleich</title>
    <link rel="stylesheet" href="image-compare.css">
</head>
<body>
    <div class="container">
        <header>
            <h1>🔍 Bildvergleich</h1>
            <p>Lade zwei Bilder hoch und finde die Unterschiede</p>
            <a href="../../index.html" class="back-button">← Zurück zum Hub</a>
        </header>

        <main>
            <div class="upload-section">
                <div class="upload-box">
                    <h3>Bild A</h3>
                    <input type="file" id="imageA" accept="image/*,.pdf,.tif,.tiff,application/pdf">
                    <label for="imageA" class="upload-label">
                        <span class="upload-icon">📁</span>
                        <span>Bild A hochladen</span>
                    </label>
                    <small>Unterstützt: JPG, PNG, GIF, BMP, WebP, SVG, PDF, TIF/TIFF</small>
                </div>
                <div class="upload-box">
                    <h3>Bild B</h3>
                    <input type="file" id="imageB" accept="image/*,.pdf,.tif,.tiff,application/pdf">
                    <label for="imageB" class="upload-label">
                        <span class="upload-icon">📁</span>
                        <span>Bild B hochladen</span>
                    </label>
                    <small>Unterstützt: JPG, PNG, GIF, BMP, WebP, SVG, PDF, TIF/TIFF</small>
                </div>
            </div>

            <div class="controls">
                <div class="control-group">
                    <label for="sensitivity">Empfindlichkeit: <span id="sensitivityValue">70</span></label>
                    <input type="range" id="sensitivity" min="0" max="100" value="70">
                </div>
                <div class="control-group zoom-controls">
                    <label>Zoom: <span id="zoomValue">100</span>%</label>
                    <div class="zoom-buttons">
                        <button id="zoomOut" class="btn-zoom" title="Verkleinern">−</button>
                        <button id="zoomReset" class="btn-zoom" title="Zurücksetzen">⟲</button>
                        <button id="zoomIn" class="btn-zoom" title="Vergrößern">+</button>
                    </div>
                </div>
                <button id="compareBtn" class="btn-primary" disabled>Bilder vergleichen</button>
                <button id="resetBtn" class="btn-secondary">Zurücksetzen</button>
            </div>

            <div class="results-section" id="resultsSection">
                <div class="view-tabs">
                    <button class="tab-btn active" data-view="side-by-side">Nebeneinander</button>
                    <button class="tab-btn" data-view="overlay">Überlagert</button>
                    <button class="tab-btn" data-view="difference">Nur Unterschiede</button>
                </div>

                <div class="comparison-container" id="comparisonContainer">
                    <!-- Side by Side View -->
                    <div class="view-content active" id="sideBySideView">
                        <div class="image-wrapper">
                            <h4>Bild A</h4>
                            <div class="canvas-container">
                                <canvas id="canvasA"></canvas>
                                <canvas class="minimap" id="minimapA"></canvas>
                            </div>
                        </div>
                        <div class="image-wrapper">
                            <h4>Bild B</h4>
                            <div class="canvas-container">
                                <canvas id="canvasB"></canvas>
                                <canvas class="minimap" id="minimapB"></canvas>
                            </div>
                        </div>
                    </div>

                    <!-- Overlay View -->
                    <div class="view-content" id="overlayView">
                        <div class="image-wrapper single">
                            <div class="canvas-container">
                                <canvas id="canvasOverlay"></canvas>
                                <canvas class="minimap" id="minimapOverlay"></canvas>
                            </div>
                            <div class="overlay-controls">
                                <label>Transparenz: <span id="opacityValue">50</span>%</label>
                                <input type="range" id="opacity" min="0" max="100" value="50">
                            </div>
                        </div>
                    </div>

                    <!-- Difference View -->
                    <div class="view-content" id="differenceView">
                        <div class="image-wrapper single">
                            <h4>Erkannte Unterschiede</h4>
                            <div class="canvas-container">
                                <canvas id="canvasDiff"></canvas>
                                <canvas class="minimap" id="minimapDiff"></canvas>
                            </div>
                            <div class="stats" id="diffStats"></div>
                        </div>
                    </div>
                </div>
            </div>
        </main>
    </div>

    <!-- PDF.js Library -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.min.js"></script>
    <script>
        // Configure PDF.js worker
        if (typeof pdfjsLib !== 'undefined') {
            pdfjsLib.GlobalWorkerOptions.workerSrc = 'https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.worker.min.js';
        }
    </script>
    <!-- TIFF.js Library -->
    <script src="https://cdn.jsdelivr.net/npm/tiff.js@latest/tiff.min.js"></script>
    <script src="image-compare.js"></script>
</body>
</html>
