<!DOCTYPE html>
<html lang="de">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Tetris</title>
    <link rel="stylesheet" href="tetris.css">
</head>
<body>
    <div class="container">
        <header>
            <a href="../../index.html" class="back-button">← Zurück zum Hub</a>
            <h1>🎮 Tetris</h1>
        </header>

        <div class="game-container">
            <div class="info-panel">
                <div class="info-item">
                    <span class="label">Punkte:</span>
                    <span id="score" class="value">0</span>
                </div>
                <div class="info-item">
                    <span class="label">Level:</span>
                    <span id="level" class="value">1</span>
                </div>
                <div class="info-item">
                    <span class="label">Reihen:</span>
                    <span id="lines" class="value">0</span>
                </div>
                <div class="next-piece">
                    <p class="label">Nächster Block:</p>
                    <canvas id="next-canvas"></canvas>
                </div>
            </div>

            <div class="game-area">
                <canvas id="game-canvas"></canvas>
                <button id="start-btn" class="start-btn">Neues Spiel</button>
            </div>

            <div class="controls-panel">
                <div class="mobile-controls">
                    <div class="control-row">
                        <button class="control-btn" data-action="rotate">↻</button>
                    </div>
                    <div class="control-row">
                        <button class="control-btn" data-action="left">←</button>
                        <button class="control-btn" data-action="down">↓</button>
                        <button class="control-btn" data-action="right">→</button>
                    </div>
                    <div class="control-row">
                        <button class="control-btn wide" data-action="drop">Drop ⬇</button>
                    </div>
                </div>

                <div class="instructions">
                    <p><strong>Steuerung:</strong></p>
                    <p>← → : Bewegen</p>
                    <p>↑ : Drehen</p>
                    <p>↓ : Schneller fallen</p>
                    <p>Leertaste: Drop</p>
                </div>
            </div>
        </div>
    </div>

    <script src="tetris.js"></script>
</body>
</html>
